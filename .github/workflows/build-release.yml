name: Android Automotive Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release GFlow APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve next prerelease version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --exclude-drafts \
              --json tagName \
              --jq '[.[] | .tagName | capture("^v1\\.(?<minor>[0-9]+)$")? | .minor | tonumber] | max // -1'
          )"
          next_minor=$((latest + 1))
          version_name="1.${next_minor}"
          version_code=$((100 + next_minor))
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${version_name}" >> "$GITHUB_OUTPUT"

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gflow-release.keystore"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Signed Automotive Release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/gflow-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK Asset
        run: |
          mkdir -p build/release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "build/release-assets/GFlow-${{ steps.version.outputs.version_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: GFlow ${{ steps.version.outputs.version_name }}
          body: |
            Automated Android Automotive OS Release Build (v${{ steps.version.outputs.version_name }}).
            Target SDK 35, Min SDK 30.
            Signed with static release/debug key for update compatibility.
          files: |
            build/release-assets/GFlow-${{ steps.version.outputs.version_name }}.apk
          overwrite: true
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
