name: Build & Publish Automotive APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release GFlow APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Dynamic Version Name
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${github.ref_name}"
          else
            # Dynamic version for main commits: 1.<run_number> (e.g. 1.0, 1.1, 1.2...)
            RUN_NUM="${{ github.run_number }}"
            VERSION_NAME="v1.${RUN_NUM}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "Determined Version Name: ${VERSION_NAME}"

      - name: Generate Static Debug/Test Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Signed Automotive Release APK
        run: flutter build apk --release

      - name: Prepare Dynamic APK Asset
        run: |
          mkdir -p build/release-assets
          APK_NAME="gflow-${ENV:VERSION_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/release-assets/gflow-${VERSION_NAME}.apk"
          echo "APK asset prepared: build/release-assets/gflow-${VERSION_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: GFlow Automotive Release ${{ env.VERSION_NAME }}
          body: |
            Automated Android Automotive OS Release Build (${{ env.VERSION_NAME }}).
            Target SDK 35, Min SDK 30.
            Signed with static debug/test key for update compatibility.
          draft: false
          prerelease: false
          files: |
            build/release-assets/gflow-${{ env.VERSION_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
